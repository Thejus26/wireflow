name: ✨ Feature request
description: Suggest an idea or enhancement for Wireflow
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please check the [roadmap in the README](https://github.com/Thejus26/wireflow#readme) and [existing issues](https://github.com/Thejus26/wireflow/issues?q=is%3Aissue) first.

        Looking to add a specific chip or package? Use the **Component / footprint request** form instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that's hard or impossible today? Describe the problem, not just the solution.
      placeholder: I'm documenting an ESP32 breakout and I can't ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Sketches, mockups, and example syntax are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried or thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Canvas / editor UX
        - Component / package designer
        - Wire routing
        - ERC (electrical rules check)
        - Import / DSL
        - Export / netlists
        - Accessibility
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to help build this?
      options:
        - "Yes, I'd like to open a pull request"
        - "Yes, with guidance"
        - "No, I'm just suggesting it"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, or examples from other tools.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: I agree to follow this project's [Code of Conduct](https://github.com/Thejus26/wireflow/blob/main/CODE_OF_CONDUCT.md)
          required: true
